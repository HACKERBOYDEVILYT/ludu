name: Build & Release RS Ludo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & AAB Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment File
        run: |
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Configure Signing Keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore from secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using base64 fallback keystore..."
            base64 --decode debug.keystore.base64 > "$GITHUB_WORKSPACE/my-upload-key.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Generating fallback keystore for release artifact..."
            keytool -genkey -v -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=RSLudo, OU=Gaming, O=RS, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Build Release Bundle (AAB)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            gradle bundleRelease --no-daemon
          fi

      - name: Prepare Artifact Files
        id: prepare_files
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

          # Find and copy APK
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release-artifacts/RS-Ludo-${TAG}.apk"
            echo "Found APK: $APK_FILE"
          fi

          # Find and copy AAB
          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release-artifacts/RS-Ludo-${TAG}.aab"
            echo "Found AAB: $AAB_FILE"
          fi

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: RS-Ludo-Release-Builds
          path: release-artifacts/*
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "RS Ludo ${{ env.RELEASE_TAG }}"
          body: |
            ## 🎲 RS Ludo ${{ env.RELEASE_TAG }} Release

            ### ✨ What's Included:
            - **Custom Player Photo Avatars**: Upload personal photos directly to Ludo tokens and home bases.
            - **Premium 15x15 Ludo Board**: Responsive layout with smooth step-by-step animations.
            - **Game Modes**: 2-4 Players Local Match & Single Player vs Smart AI.
            - **Rich Audio & Haptics**: Built-in sound effects and tactile feedback.
            - **Interactive Reactions**: Quick emoji reactions and combo announcements ("LUCKY 6!", "CAPTURE!", "HOME!").
            - **Career Statistics**: Track wins, losses, win rate %, and win streaks.

            ### 📦 Download Assets:
            - **APK**: Directly installable on Android devices.
            - **AAB**: Google Play Store deployment package.
          files: release-artifacts/*
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
